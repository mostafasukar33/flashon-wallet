.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.col{display:flex;flex-direction:column;gap:6px}
.mute{color:var(--mute)}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n){ if(n==null||isNaN(n)) return '—'; var r=Math.round(n*100)/100; var frac=Math.abs(r%1)>0.001; return r.toLocaleString('en-US',{minimumFractionDigits:frac?2:0,maximumFractionDigits:2}); }
function fmt2(n){ if(n==null||isNaN(n)) return '—'; return (Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
var dayF, timeF, monF, shortF;
try{
  dayF=new Intl.DateTimeFormat('ar-EG-u-nu-latn',{weekday:'long',day:'numeric',month:'long'});
  timeF=new Intl.DateTimeFormat('ar-EG-u-nu-latn',{hour:'numeric',minute:'2-digit'});
  monF=new Intl.DateTimeFormat('ar-EG-u-nu-latn',{month:'long',year:'numeric'});
  shortF=new Intl.DateTimeFormat('ar-EG-u-nu-latn',{day:'numeric',month:'long'});
}catch(e){ var f={format:function(d){return d.toLocaleString()}}; dayF=timeF=monF=shortF=f; }
function monthName(key){ var p=key.split('-'); return monF.format(new Date(+p[0],+p[1]-1,15)); }
function monthKey(t){ var d=new Date(t); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2); }
function dayKey(t){ var d=new Date(t); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }
function accLabel(w){ var n=nowOf(w); return n?n.label:(w.charAt(0)==='v'?'فودافون كاش':'اتصالات كاش'); }

function nowOf(w){ return D.now.filter(function(x){return x.w===w})[0]; }

/* ---------- navigation ---------- */
function go(screen, extra){ S.stack.push({screen:S.screen,wallet:S.wallet,phone:S.phone,scroll:window.scrollY}); S.screen=screen; for(var k in (extra||{})) S[k]=extra[k]; render(); window.scrollTo(0,0); }
function back(){
  if (document.getElementById('sheet').classList.contains('open')) { closeSheet(); return true; }
  var p=S.stack.pop(); if(!p) return false;
  S.screen=p.screen; S.wallet=p.wallet; S.phone=p.phone; render(); window.scrollTo(0,p.scroll||0);
  if (S.screen==='sms' && B.loadThreads) B.loadThreads();
  return true;
}

/* ---------- screens ---------- */
function render(){
  if (!D) return;
  if (!D.permission) { $app.innerHTML = onboarding(); return; }
  if ((S.screen==='sms'||S.screen==='chat') && !smsOn()) { S.screen='home'; S.stack=[]; }
  var h = S.screen==='limits'?limitsScreen(): S.screen==='person'?personScreen(): S.screen==='unknown'?unknownScreen(): S.screen==='settings'?settingsScreen():
    S.screen==='sms'?smsScreen(): S.screen==='chat'?chatScreen(): home();
  $app.innerHTML = h;
  if (B.viewing) B.viewing(S.screen==='chat'?String(S.chatId||''):'');
  document.body.classList.toggle('chatting', S.screen==='chat');
  fillTopbar(); watchCards();
  var q=document.getElementById('q'); if(q){ q.value=S.q; }
}

function filteredTx(){
  var q=S.q.trim().toLowerCase();
  return D.txs.filter(function(t){
    if (S.filter!=='all' && t.w!==S.filter) return false;
    if (q) return ((t.name||'')+' '+(t.phone||'')+' '+(t.smsName||'')+' '+fmt(t.amount)+' '+t.amount).toLowerCase().indexOf(q)>=0;
    return monthKey(t.time)===S.month;
  }).sort(function(a,b){return b.time-a.time});
}

function txRow(t){
  var isIn=t.type==='in';
  return '<button class="tx" data-act="tx" data-id="'+esc(t.id)+'">'+
    '<span class="dot" style="background:'+(isIn?'var(--in-bg)':'var(--out-bg)')+'">'+(isIn?ICON.inA:ICON.outA)+'</span>'+
    '<span class="mid"><span class="who'+(t.name&&/^[0-9+]+$/.test(t.name)?' num':'')+'" style="text-align:right">'+esc(t.name||t.kind)+'</span>'+
    '<span class="xs mute">'+esc(t.kind)+' · '+wname(t.w)+' · '+timeF.format(new Date(t.time))+'</span></span>'+
    '<span class="amt"><b class="num '+(isIn?'in':'out')+'">'+(isIn?'+':'−')+fmt2(t.amount)+'</b>'+
    '<span class="xs mute">'+(t.fee>0?'+ '+fmt(t.fee)+' رسوم':(t.balance!=null?'رصيد '+fmt(t.balance):''))+'</span></span></button>';
}

function txList(list){
  if (!list.length) return '<div class="empty">'+(S.q?'مفيش نتايج للبحث ده':'مفيش عمليات في الشهر ده')+'</div>';
  var out='', last='';
  list.forEach(function(t){ var k=dayKey(t.time); if(k!==last){ out+='<div class="day">'+dayF.format(new Date(t.time))+'</div>'; last=k; } out+=txRow(t); });
  return out;
}

function limitsOf(n){ var g=D.settings, l=n.limits||{}; return {monthReceive:l.monthReceive!=null?l.monthReceive:g.monthReceive, monthSend:l.monthSend!=null?l.monthSend:g.monthSend, daySend:l.daySend!=null?l.daySend:g.daySend, dayReceiveOn:g.dayReceiveOn, dayReceive:g.dayReceive, feesCount:g.feesCount, own:!!l.own}; }
function limitCard(n){
  var st=limitsOf(n);
  function bar(label, used, max, color){
    var pct=Math.min(100, max>0?used/max*100:0);
    return '<div class="lim"><div class="row small"><span>'+label+'</span><span class="num">'+fmt(used)+' / '+fmt(max)+'</span></div>'+
      '<div class="bar"><i style="width:'+pct.toFixed(1)+'%;min-width:'+(used>0?'3px':'0')+';background:'+color+'"></i></div></div>';
  }
  var line;
  if (n.locked>0) line='<span class="small" style="color:var(--bad-ink);font-weight:700">'+fmt(n.locked)+' ج هيتقفل عليهم للشهر الجاي</span>';
  else if (n.balance!=null && n.canSendNow < n.balance - 0.009) line='<span class="small" style="color:var(--warn-ink);font-weight:600">تقدر تحوّل دلوقتي '+fmt(n.canSendNow)+' بس (حد اليوم)</span>';
  else line='<span class="small in" style="font-weight:600">تقدر تحوّل دلوقتي '+(n.balance!=null?fmt(n.canSendNow)+' (رصيدك كله)':fmt(n.canSendNow))+' ✓</span>';
  return '<button class="card col" style="gap:10px;text-align:right;width:100%" data-act="limits" data-w="'+n.w+'">'+
    '<div class="row"><h2>حدود '+esc(n.label)+' الشهر ده</h2><span class="small" style="color:var(--blue);font-weight:600">التفاصيل ←</span></div>'+
    bar('استلام', n.monthReceived, st.monthReceive, 'var(--in)')+
    bar('تحويل', n.monthSent, st.monthSend, 'var(--out)')+
    bar('تحويل النهارده', n.daySent, st.daySend, 'var(--day)')+
    (st.dayReceiveOn?bar('استلام النهارده', n.dayReceived, st.dayReceive, '#2E7D9A'):'')+
    line+'</button>';
}

function held(){ return !!(D.hold && D.hold.held); }
function notesOff(){ var n=D.notes; return D.notifOk===false || !!(n && ((D.watch && !n.line) || n.watch===0 || n.tx===0)); }
var ALARM='<span class="xs mute" style="line-height:1.6">علامة المنبّه ⏰ اللي فوق جنب الساعة دي من «محافظي»: بيصحّي نفسه بيها كل دقيقة علشان الموبايل ميجمّدوش. مش منبّه هيرن.</span>';
function times(n){ return n===2?'مرتين':n<=10?n+' مرات':n+' مرة'; }
function en(t){ return '<bdi dir="ltr" style="white-space:nowrap">('+t+')</bdi>'; }
function dur(ms){
  var m=Math.round(ms/60000);
  if (m<1) return 'أقل من دقيقة'; if (m===1) return 'دقيقة'; if (m===2) return 'دقيقتين'; if (m<=10) return m+' دقايق'; if (m<60) return m+' دقيقة';
  var h=Math.round(m/60); return h===1?'ساعة':h===2?'ساعتين':h<=10?h+' ساعات':h+' ساعة';
}
function bgState(){
  var H=D.hold||{};
  if (listenOn() && !smsOn()) return '<span class="small mute" style="line-height:1.7">«محافظي» بيسمع إشعارات الرسايل، فأي رسالة بتوصله في نفس اللحظة اللي تطبيق الرسايل بيعرضها فيها، ومن غير المنبّه ⏰ اللي كان كل دقيقة. السطر «💰 محافظي شغال» لسه موجود احتياطي.</span>';
  if (smsOn()) return '<span class="small mute" style="line-height:1.7">«محافظي» هو تطبيق الرسايل، فأي رسالة بتوصله الأول حتى لو الموبايل جمّده، ومن غير المنبّه ⏰ اللي كان كل دقيقة. السطر «💰 محافظي شغال» لسه موجود احتياطي.</span>';
  if (held()) {
    return '<div class="alert bad"><b>⚠️ الموبايل جمّد التطبيق '+dur(H.gap)+' وهو مقفول</b>'+
      '<span style="line-height:1.7">آخر مرة '+dayF.format(new Date(H.at))+' الساعة '+timeF.format(new Date(H.at))+(H.n>1?'، واتكررت '+times(H.n):'')+'.'+
      (H.missLag?' وآخر تحويل وصل التطبيق بعد '+dur(H.missLag)+' من وصول الرسالة.':'')+
      ' وهو متجمّد مفيش أي حاجة في التطبيق بتشتغل، ولا حتى استقبال الرسايل، لحد ما تفتحه. الحل في «التحويلات توصل في نفس اللحظة» اللي فوق.</span></div>'+
      '<details class="old"><summary>أو الإعدادات (مش مضمونة على الموبايل ده)</summary>'+oldSteps()+'</details>';
  }
  if (H.at) {
    return '<div class="alert good"><b>✓ اتصلحت</b><span style="line-height:1.7">التطبيق فضل صاحي '+dur(H.best)+' والشاشة مقفولة من غير ما الموبايل يجمّده، فالتحويل بيوصل الآيفون في نفس اللحظة.</span></div>'+
      '<span class="xs mute" style="line-height:1.6">لو رجع جمّده تاني هيظهرلك تنبيه أحمر فوق على طول.</span>'+ALARM;
  }
  return '<span class="small mute" style="line-height:1.7">التطبيق شغال ومستني التحويلات (علشان كده فيه سطر «💰 محافظي شغال» ثابت فوق). وبيراقب نفسه: لو الموبايل جمّده وهو مقفول هيظهرلك تنبيه أحمر على طول.</span>'+ALARM+bgBtns();
}
function smsOn(){ return !VIEW && !!(D && D.smsApp && D.smsApp.on); }
function smsCan(){ return !VIEW && !!(D && D.smsApp && D.smsApp.can && !D.smsApp.on); }
function smsOnBox(more){
  return '<div class="alert good"><b>✓ «محافظي» هو تطبيق الرسايل</b><span style="line-height:1.7">أندرويد بيدّي أي رسالة لتطبيق الرسايل الأول علشان يحفظها، والموبايل مبيقدرش يمنعها عنه حتى لو جمّده. فالتحويل بيروح الآيفون أول ما الرسالة توصل.</span></div>'+
    '<button class="btn ghost" data-act="sms">افتح الرسايل</button>'+
    (more?'<button class="btn ghost" data-act="defapps">رجّع تطبيق الرسايل القديم</button><span class="xs mute" style="line-height:1.6">هتفتح «التطبيقات الافتراضية»: اختار «تطبيق الرسايل» وبعدين التطبيق القديم. كل الرسايل هتلاقيها فيه، بس الموبايل هيرجع يجمّد «محافظي» والتحويل يتأخر تاني.</span>':'');
}

  var H=D.hold||{};

/* ---------- messages (when محافظي is the SMS app) ---------- */
var SMS={threads:null, chat:null};
function isNumName(n){ return /^[0-9+ ]+$/.test(n||''); }
function avatar(n){ var c=String(n||'').trim().charAt(0); return (!c||/[0-9+]/.test(c))?'#':c.toUpperCase(); }
function whenF(t){ var d=new Date(t); return dayKey(t)===dayKey(Date.now())?timeF.format(d):shortF.format(d); }
function smsScreen(){
  var h='<div class="wrap"><button class="back" data-act="back">→ رجوع</button><div class="row"><h1>الرسايل</h1><button class="pill" data-act="newchat">رسالة جديدة</button></div>';
  if (!SMS.threads) return h+'<div class="empty">لحظة…</div></div>';
  if (!SMS.threads.length) return h+'<div class="empty">مفيش رسايل</div></div>';
  return h+'<div class="col" style="gap:8px">'+SMS.threads.map(function(t){
    var nm=t.name||t.addr;
    return '<button class="th'+(t.unread?' un':'')+'" data-act="chat" data-id="'+esc(t.id)+'" data-a="'+esc(t.addr)+'">'+
      '<span class="av">'+esc(avatar(nm))+'</span>'+
      '<span class="mid"><span class="nm'+(isNumName(nm)?' num':'')+'" style="text-align:right">'+esc(nm)+'</span>'+
      '<span class="sn" dir="auto" style="text-align:right">'+(t.out?'انت: ':'')+esc(t.snippet)+'</span></span>'+
      '<span class="side"><span class="xs mute">'+whenF(t.time)+'</span>'+(t.unread?'<span class="cnt num">'+t.unread+'</span>':'')+'</span></button>';
  }).join('')+'</div></div>';
}
function chatHead(){
  var c=SMS.chat, nm=c?(c.name||c.addr):(S.chatAddr||'');
  if (!nm) return '<h1>رسالة جديدة</h1><div class="field"><label for="smsTo">لـ</label><input type="tel" id="smsTo" class="num" dir="ltr" style="text-align:left" placeholder="01xxxxxxxxx" value="'+esc(S.toDraft||'')+'"></div>';
  return '<h1 class="'+(isNumName(nm)?'num':'')+'" style="text-align:right">'+esc(nm)+'</h1>'+(c&&c.name&&c.addr?'<span class="num mute small" style="text-align:right">'+esc(c.addr)+'</span>':'');
}
/* why a send failed, from the phone's code (r<result>/<network error>, perm:…, ex:…) */
function whyFail(e){
  e=String(e||''); var r=(e.match(/^r(\d+)/)||[])[1];
  if (e.indexOf('perm')===0) return 'أندرويد مش سامح لـ«محافظي» يبعت رسايل';
  if (r==='2') return 'الشبكة مقفولة (وضع الطيران؟)';
  if (r==='4') return 'مفيش شبكة على الخط ده، جرّب الخط التاني';
  if (r==='5') return 'رسايل كتير ورا بعض، استنى شوية';
  if (r==='6') return 'الخط مقفول على أرقام معينة (FDN)';
  if (r==='7'||r==='8') return 'الرقم ده مبيستقبلش رسايل';
  if (r==='1') return 'الشبكة رفضتها: اتأكد إن فيه رصيد على الخط، أو جرّب الخط التاني';
  if (r) return 'مبعتتش (كود '+r+')، جرّب الخط التاني';
  if (e) return 'مبعتتش، جرّب تاني';
  return '';
}
function canReply(a){ return /[0-9]{3,}/.test(a||'') && !/[A-Za-z\u0600-\u06FF]/.test(a||''); }
function lineName(sub){
  var pl=(D&&D.phoneLines)||[], m=pl.filter(function(x){return x.key==='s'+sub})[0], c=SMS.chat, i=c&&c.subs?c.subs.indexOf(sub):-1;
  return 'خط '+(m?m.n:(i+1))+(m&&m.own&&m.own[0]?' · '+m.own[0].slice(-4):'');
}
function chatBody(){
  var c=SMS.chat;
  if (!c) return (S.chatId||S.chatAddr)?'<div class="empty">لحظة…</div>':'';
  if (!c.msgs.length) return '<div class="empty">مفيش رسايل لسه</div>';
  var out='', last='';
  c.msgs.forEach(function(m){
    var k=dayKey(m.time); if(k!==last){ out+='<div class="day" style="text-align:center">'+dayF.format(new Date(m.time))+'</div>'; last=k; }
    out+='<div class="bub '+(m.out?'s':'r')+'" dir="auto">'+esc(m.body)+
      '<span class="tm'+(m.st===2?' bad':'')+'">'+(m.st===1?'بيتبعت…':m.st===2?'⚠️ مبعتتش'+(whyFail(m.err)?': '+esc(whyFail(m.err)):''):timeF.format(new Date(m.time)))+'</span>'+
      (m.st===2&&m.id?'<button class="pill" style="margin-top:6px;min-height:36px;font-size:14px" data-act="resend" data-id="'+m.id+'">ابعتها تاني</button>':'')+'</div>';
  });
  return out;
}
function simRow(){
  var c=SMS.chat; if (!c || !c.subs || c.subs.length<2) return '';
  if (S.sendSub==null || c.subs.indexOf(S.sendSub)<0) S.sendSub=(c.subs.indexOf(c.sub)>=0?c.sub:c.subs[0]);
  return '<div class="chips" style="gap:6px;margin-bottom:6px;max-width:560px;margin-inline:auto"><span class="xs mute" style="align-self:center">يبعت من:</span>'+c.subs.map(function(x){
    return '<button class="chip'+(x===S.sendSub?' on':'')+'" style="min-height:34px;padding:4px 12px;font-size:13px" data-act="sim" data-sub="'+x+'">'+esc(lineName(x))+'</button>'; }).join('')+'</div>';
}
function composeBar(){
  var a=(SMS.chat&&SMS.chat.addr)||S.chatAddr||'';
  if (a && !canReply(a)) return '<div class="compose"><div class="in3 xs mute" style="justify-content:center;min-height:40px;align-items:center">مينفعش ترد على الاسم ده، هو بيبعت بس</div></div>';
  return '<div class="compose" id="compose">'+simRow()+'<div class="in3"><textarea id="smsText" rows="1" placeholder="اكتب رسالة" dir="auto" aria-label="الرسالة">'+esc(S.draft||'')+'</textarea>'+
    '<button data-act="send">ابعت</button></div></div>';
}
function chatScreen(){
  return '<div class="wrap"><button class="back" data-act="back">→ رجوع</button><div class="col" style="gap:2px" id="chatHead">'+chatHead()+'</div>'+
    '<div class="chat" id="chat">'+chatBody()+'</div></div>'+composeBar();
}
function drawChat(){
  var hd=document.getElementById('chatHead'), b=document.getElementById('chat');
  if (!hd || !b) { render(); }
  else if (!document.getElementById('smsTo') || SMS.chat) {
    if (!(document.activeElement && document.activeElement.id==='smsTo')) hd.innerHTML=chatHead(); b.innerHTML=chatBody();
    var cp=document.getElementById('compose'), ta=document.getElementById('smsText');
    if (cp && ta) { var sr=simRow(), old=cp.querySelector('.chips'); if (old) old.remove(); if (sr) cp.insertAdjacentHTML('afterbegin', sr); }
    else if (!(ta && document.activeElement===ta)) { var y=window.scrollY; render(); }
  }
  window.scrollTo(0, document.body.scrollHeight);
}
function grow(t){ t.style.height='auto'; t.style.height=Math.min(140, t.scrollHeight+2)+'px'; }
function sendSms(){
  var t=document.getElementById('smsText'), text=(t?t.value:'').trim();
  var to=(SMS.chat&&SMS.chat.addr)||S.chatAddr||((document.getElementById('smsTo')||{}).value||'').trim();
  if (!to) { toast('اكتب الرقم'); var i=document.getElementById('smsTo'); if(i) i.focus(); return; }
  if (!text) return;
  if (!canReply(to)) { toast('مينفعش تبعت للاسم ده'); return; }
  S.lastText=text;
  B.sendSms(to, text, S.sendSub!=null?S.sendSub:(SMS.chat&&SMS.chat.sub!=null?SMS.chat.sub:-1));
  if (!SMS.chat) { SMS.chat={id:'',addr:to,name:null,sub:-1,msgs:[]}; S.chatAddr=to; }
  SMS.chat.msgs.push({id:0,body:text,time:Date.now(),out:true,st:1});
  S.draft=''; S.toDraft=''; if (t) { t.value=''; grow(t); }
  var hd=document.getElementById('chatHead'); if (hd) hd.innerHTML=chatHead();
  var b=document.getElementById('chat'); if (b) b.innerHTML=chatBody();
  window.scrollTo(0, document.body.scrollHeight);
}

function accLimSheet(w){

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  if (e.target.id==='sheetBg') { closeSheet(); return; }
  var el=e.target.closest('[data-act]'); if(!el) return;
  var a=el.getAttribute('data-act');
  switch(a){
    case 'perm': B.requestSms(); break;
    case 'battery': B.openBattery(); break;
    case 'autostart': if (B.openAutostart) B.openAutostart(); break;
    case 'appbat': if (B.openAppBattery) B.openAppBattery(); else B.openBattery(); break;
    case 'powersave': if (B.openPowerSaving) B.openPowerSaving(); break;
    case 'fixhold': openSheet('<h2>علشان التحويل يوصل في نفس اللحظة</h2>'+holdSteps()); break;
    case 'smsapp': if (B.askSmsApp) B.askSmsApp(); break;
    case 'noteacc': S.noteTried=true; if (B.openNoteAccess) B.openNoteAccess(); break;
    case 'callperm': if (B.askCallPerm) B.askCallPerm(); break;
    case 'accset': S.accTried=true; if (B.openAccessibility) B.openAccessibility(); break;
    case 'xfer':
      S.xfAsk=false;
      // from a wallet's screen, or with one wallet picked on the home screen: that wallet's line
      var pre=el.dataset.w || (S.screen==='home' && S.filter!=='all' ? S.filter : '');
      if (!(X().accounts||[]).some(function(n){return n.w===pre})) pre=S.xf&&S.xf.w;
      S.xf=pre?{w:pre}:null; xferSheet(); break;
    case 'xacc': xferRead(); S.xf.w=el.dataset.w; xferSheet(); break;
    case 'xnext':
      var xf=xferRead(), bad=xferCheck(xf);
      if (bad) { toast(bad); break; }
      S.xfAsk=true; xferSheet(); break;
    case 'xback': S.xfAsk=false; xferSheet(); break;
    case 'xgo':
      if (!S.xf) break;
      var gb=document.getElementById('xgo'); if (gb) { gb.disabled=true; gb.textContent=VIEW?'بيبعت…':'بيطلب الكود…'; }
      B.sendXfer(JSON.stringify({w:S.xf.w,to:S.xf.to,a:S.xf.a,pin:S.xf.pin}));
      S.xf.pin=''; break;
    case 'xdial': var dx=xferRead(); if (!xMobile(dx.to)) { toast('اكتب رقم موبايل مصري صح'); break; } if (B.dialXfer) B.dialXfer(xMobile(dx.to), digits(dx.a)); break;
    case 'xcode':
      var xc=document.getElementById('s_xcode'); if (!xc) break;
      if (B.setXferCode && B.setXferCode(xc.value.trim())===false) toast('الكود لازم يكون فيه {n} و{a} وأرقام و* و# بس'); else toast('اتحفظ'); break;
    case 'xcodedef': if (B.setXferCode) B.setXferCode(''); toast('رجع الكود العادي'); break;
    case 'appinfo': if (B.openAppInfo) B.openAppInfo(); break;
    case 'defapps': if (B.openDefaultApps) B.openDefaultApps(); break;
    case 'sms': closeSheet(); SMS.threads=null; go('sms'); B.loadThreads(); break;
    case 'chat': SMS.chat=null; S.draft=''; go('chat',{chatId:el.dataset.id, chatAddr:el.dataset.a}); B.loadChat(el.dataset.id, el.dataset.a); break;
    case 'newchat': SMS.chat=null; S.draft=''; go('chat',{chatId:'', chatAddr:''}); setTimeout(function(){var i=document.getElementById('smsTo'); if(i) i.focus();},200); break;
    case 'send': sendSms(); break;
    case 'sim': S.sendSub=+el.dataset.sub; var cp=document.getElementById('compose'), o=cp&&cp.querySelector('.chips'); if (o) o.outerHTML=simRow(); break;
    case 'resend':
      var fm=(SMS.chat&&SMS.chat.msgs||[]).filter(function(x){return String(x.id)===el.dataset.id})[0];
      if (fm) { if (B.deleteSms) B.deleteSms(String(fm.id)); var ta=document.getElementById('smsText'); if (ta) ta.value=fm.body; SMS.chat.msgs=SMS.chat.msgs.filter(function(x){return x!==fm}); sendSms(); }
      break;
    case 'notif': if (B.openNotif) B.openNotif(); break;
    case 'settings': go('settings'); break;
    case 'back': back(); break;
    case 'totop': window.scrollTo({top:0,behavior:'smooth'}); break;
    case 'wallet': S.filter = S.filter===el.dataset.w?'all':el.dataset.w; render(); break;
    case 'filter': S.filter=el.dataset.f; render(); break;
    case 'limits': go('limits',{wallet:el.dataset.w}); break;
    case 'unknown': go('unknown'); break;
    case 'tx': txSheet(el.dataset.id); break;
    case 'person': closeSheet(); go('person',{phone:el.dataset.p, personAll:true}); break;
    case 'pall': S.personAll=el.dataset.v==='1'; render(); break;
    case 'rename': renameSheet(); break;
    case 'accname': accNameSheet(); break;
    case 'acclim': accLimSheet(el.dataset.w); break;
    case 'saveacclim':
      var g=function(id){var x=parseFloat(document.getElementById(id).value); return isNaN(x)?0:x;};
      B.setAccountLimits(el.dataset.w, JSON.stringify({monthReceive:g('al_mr'),monthSend:g('al_ms'),daySend:g('al_ds')})); closeSheet(); toast('اتحفظ'); break;
    case 'resetacclim': B.setAccountLimits(el.dataset.w, 'null'); closeSheet(); toast('رجعت للحدود العادية'); break;
    case 'editlines': S.editLines=true; render(); break;
    case 'savelines':
      var m={}; Array.prototype.forEach.call(document.querySelectorAll('.lnsel'),function(x){ if(x.value) m[x.getAttribute('data-line')]=x.value; });
      if (!Object.keys(m).length) { toast('اختار محفظة واحدة على الأقل'); break; }
      S.editLines=false; B.setLines(JSON.stringify(m)); toast('اتحفظ'); break;
    case 'autolines': S.editLines=false; B.setLines('null'); toast('رجع يعرفها لوحده'); break;
    case 'export': B.exportMonth(document.getElementById('ex_m').value, document.getElementById('ex_w').value); break;
    case 'saveacc': B.setAccountName(S.wallet, document.getElementById('an').value.trim()); closeSheet(); toast('اتحفظ'); break;
    case 'savename': B.setName(S.phone, document.getElementById('nm').value.trim()); closeSheet(); toast('اتحفظ'); break;
    case 'settype':
      B.setType(el.dataset.id, el.dataset.t, el.dataset.learn==='1'); closeSheet();
      toast(el.dataset.t==='ignore'?'اتشالت من الحساب':'اتسجلت '+(el.dataset.t==='in'?'وارد':'صادر')); break;
    case 'save':
      var v=function(id){var x=parseFloat(document.getElementById(id).value); return isNaN(x)?0:x;};
      B.saveSettings(JSON.stringify({monthReceive:v('s_mr'),monthSend:v('s_ms'),daySend:v('s_ds'),dayReceiveOn:document.getElementById('s_dro').checked,dayReceive:v('s_dr'),feesCount:document.getElementById('s_fee').checked}));
      toast('اتحفظ'); break;
    case 'rescan': B.rescan(); toast('بيقرا الرسايل…'); break;
    case 'syncon': syncOn(); break;
    case 'syncnew': openSheet('<h2>لينك وباسورد جداد</h2><span class="small mute" style="line-height:1.7">اللينك القديم هيبطل يفتح، وهتفتح الجديد على الآيفون وتكتب الباسورد الجديد.</span>'+pwField()+'<button class="btn main" data-act="syncon">اعمله</button>'); setTimeout(function(){var i=document.getElementById('sy_pw'); if(i) i.focus();},250); break;
    case 'syncoff': B.setSync(false, ''); toast('بيقفله…'); break;
    case 'synccopy': B.copySync(); break;
    case 'syncshare': B.shareSync(); break;
    case 'chkupd': B.checkUpdate(); toast('بيشوف…'); break;
    case 'dl': B.downloadUpdate(); toast('بينزل التحديث…'); break;
  }
});
/* small balance bar that slides in when the big cards scroll out of view (it never moves the page) */
var topShown=false, obs=null;
function fillTopbar(){
  var t=document.getElementById('topbar');
  if (!D || S.screen!=='home' || !D.permission) { t.innerHTML=''; setTop(false); return; }
  t.innerHTML='<div class="in2">'+D.now.map(function(n){
    return '<button class="t" data-act="totop"><span class="xs mute">'+esc(n.label)+'</span>'+(n.balance!=null?'<b class="num" style="text-align:right">'+fmt2(n.balance)+'</b>':'<b style="color:#8A8F95">—</b>')+'</button>';
  }).join('')+'</div>';
}
function setTop(on){ if(on===topShown) return; topShown=on; document.getElementById('topbar').classList.toggle('show',on); }
function watchCards(){
  if (obs) { obs.disconnect(); obs=null; }
  var w=document.getElementById('wallets');
  if (!w) { setTop(false); return; }
  if ('IntersectionObserver' in window) {
    obs=new IntersectionObserver(function(es){ var e=es[es.length-1]; setTop(!e.isIntersecting && e.boundingClientRect.top<0); }, {threshold:0});
    obs.observe(w);
  }
}
document.addEventListener('change', function(e){ if(e.target.id==='month'){ S.month=e.target.value; render(); } if(e.target.id==='s_xrm'){ if (B.setXferRemote) B.setXferRemote(e.target.checked); toast(e.target.checked?'التحويل من الآيفون اشتغل':'التحويل من الآيفون اتقفل'); } if(e.target.id==='s_txn'){ B.setTxNotify(e.target.checked); toast(e.target.checked?'هيجيلك إشعار مع كل عملية':'الإشعارات دي اتقفلت'); } });
var qT;
document.addEventListener('input', function(e){
  if(e.target.id==='smsText'){ S.draft=e.target.value; grow(e.target); return; }
  if(e.target.id==='smsTo'){ S.toDraft=e.target.value; return; }
  if(e.target.id!=='q') return;
  S.q=e.target.value; clearTimeout(qT);
  qT=setTimeout(function(){ var l=document.getElementById('list'); if(l) l.innerHTML=txList(filteredTx()); },120);
});

/* ---------- entry points used by the phone ---------- */
function applyData(json){
  try { D=JSON.parse(json); } catch(e){ return; }
  if (!S.month || D.months.indexOf(S.month)<0) S.month=D.months[0];
  if (S.filter!=='all' && !D.now.some(function(n){return n.w===S.filter})) S.filter='all';
  // on opening, show the wallet that can send the most right now (by its limits)
  if (!S.picked) {
    var ws=D.now.filter(function(n){return n.hasData});
    if (ws.length>1) {
      var best=ws.reduce(function(b,n){ var r=Math.min(n.sendLeftMonth,n.sendLeftDay), rb=Math.min(b.sendLeftMonth,b.sendLeftDay); return r>rb?n:b; });
      S.filter=best.w;
    }
    if (ws.length) S.picked=true;
  }
  if (S.screen==='limits' && !nowOf(S.wallet)) { S.screen='home'; S.stack=[]; }
  if (S.screen==='person' && !D.txs.some(function(t){return t.phone===S.phone})) { S.screen='home'; S.stack=[]; }
  // don't redraw under an open sheet or while typing; it would close it / lose the text
  var typing = document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if (document.getElementById('sheet').classList.contains('open') || typing) { pending=true; return; }
  var y=window.scrollY; render(); window.scrollTo(0,y);
}
var pending=false;
window.App = {
  reload: function(){ if (B.refresh) B.refresh(); else applyData(B.getData()); },
  onSmsApp: function(ok){
    S.smsFail=!ok;
    if (ok) { closeSheet(); toast('✓ «محافظي» بقى تطبيق الرسايل'); }
    else if (document.getElementById('sheet').classList.contains('open')) { openSheet(holdSteps()); setTimeout(function(){ var s=document.getElementById('sheet'); s.scrollTo(0, s.scrollHeight); }, 250); }
    else if (S.screen==='settings') render();
  },
  openChat: function(j){
    var c=JSON.parse(j); SMS.chat=null; S.draft=c.body||'';
    if (S.screen==='chat') { S.chatId=c.id; S.chatAddr=c.addr; render(); }
    else go('chat',{chatId:c.id, chatAddr:c.addr});
    B.loadChat(c.id||'', c.addr||'');
  },
  onThreads: function(j){
    var o=JSON.parse(j); SMS.threads=o.threads; if (D && D.smsApp) D.smsApp.unread=o.unread;
    if (S.screen==='sms') { var y=window.scrollY; render(); window.scrollTo(0,y); }
  },
  onChat: function(j){
    var c=JSON.parse(j);
    if (S.screen!=='chat') return;
    if (S.chatId && c.id && S.chatId!==c.id && S.chatAddr!==c.addr) return;   // an older answer for another conversation
    SMS.chat=c; S.chatId=c.id; if (c.addr) S.chatAddr=c.addr; if (D && D.smsApp) D.smsApp.unread=c.unread;
    drawChat();
  },
  onXferSent: function(ok, msg, id){
    var gb=document.getElementById('xgo'); if (gb) { gb.disabled=false; gb.textContent='أيوه حوّل'; }
    if (!ok) { toast(msg||'مقدرتش أبعته'); return; }
    if (VIEW && id && S.xf) S.xfSent={id:id, to:S.xf.to, a:+S.xf.a, st:'sent', from:'iphone', at:Date.now(), msg:''};
    S.xf={w:S.xf&&S.xf.w}; S.xfAsk=false; closeSheet();
    toast(VIEW?'اتبعت للأندرويد ✓':'بيطلب الكود…');
    if (S.screen==='home') { var y=window.scrollY; render(); window.scrollTo(0,y); }
  },
  onSendPerm: function(ok){ toast(ok?'دلوقتي تقدر تبعت، دوس «ابعت» تاني':'من غير الإذن ده مينفعش يبعت رسايل'); },
  onSent: function(ok, why){
    if (why==='perm') {
      if (SMS.chat) SMS.chat.msgs=SMS.chat.msgs.filter(function(x){return x.st!==1||x.id});
      S.draft=S.lastText||''; var ta=document.getElementById('smsText'); if (ta) ta.value=S.draft;
      toast('اسمح لـ«محافظي» يبعت رسايل من السؤال اللي ظهر'); drawChat(); return;
    }
    if (!ok) toast('مقدرتش أبعتها، جرّب تاني');
    if (S.screen==='chat') B.loadChat(S.chatId||'', S.chatAddr||'');
  },
  onSmsChanged: function(){
    if (S.screen==='sms') B.loadThreads();
    else if (S.screen==='chat') B.loadChat(S.chatId||'', S.chatAddr||'');
    else App.reload();
  },
  setData: function(json){ applyData(json); },
  back: back,
  onUpdate: function(j){
    var u=JSON.parse(j); D.update=u; render();
    toast(u.available?'فيه تحديث جديد':(u.error?'مقدرتش أشوف، اتأكد من النت':'عندك آخر نسخة ✓'));
  }
};
// show the last screen at once, then bring it up to date in the background
var cached = B.getCached ? B.getCached() : '';
if (cached) applyData(cached);
App.reload();
document.addEventListener('focusout', function(){ if (pending) setTimeout(function(){ if (pending && !document.getElementById('sheet').classList.contains('open')) { pending=false; var y=window.scrollY; render(); window.scrollTo(0,y); } }, 50); });
})();
</script>
